name: Tests

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser
      - name: Run Tests
        shell: pwsh
        run: |
          Invoke-Pester ./PasswordSyncSupportTool.Tests.ps1 -Output Detailed

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Pester
        shell: powershell
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Tests
        shell: powershell
        run: |
          Invoke-Pester ./PasswordSyncSupportTool.Tests.ps1 -Output Detailed
